[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2epub"
version = "0.1.0"
description = "Turn a text PDF into a clean reflowable EPUB 3, one recipe per book"
requires-python = ">=3.11"
dependencies = ["pymupdf==2.1"]

[project.scripts]
pdf2epub = "pdf2epub.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pdf2epub"]

[tool.setuptools.package-data]
pdf2epub = ["style.css", "recipe.py.tmpl"]
